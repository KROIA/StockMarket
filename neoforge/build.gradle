import com.github.jengelman.gradle.plugins.shadow.transformers.AppendingTransformer

plugins {
    id 'com.github.johnrengelman.shadow'
}
repositories {
    maven { url 'https://maven.quiltmc.org/repository/release/' }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    flatDir {
        dir "../../../MC_ModUtilities/mc_${minecraft_version}_MC_ModUtilities/neoforge/build/libs"
        dir "../../../BankSystem/mc_${minecraft_version}_BankSystem/neoforge/build/libs"
    }
    maven { url 'https://jitpack.io' }

}
architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}



dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }

    modImplementation("com.github.KROIA.MC_ModUtilities:modutilities-neoforge:$rootProject.modutilities_version")
    include("com.github.KROIA.MC_ModUtilities:modutilities-neoforge:$rootProject.modutilities_version")

    modImplementation("com.github.KROIA.BankSystem:banksystem-neoforge:$rootProject.banksystem_version")

    // Dev-runtime-only JEI (matches fabric/build.gradle rationale): the
    // Architectury platform transformer needs to resolve JEI types referenced
    // by the JEI plugins during frame merging, or runClient can crash with
    // "TypeNotPresentException: Type mezz/jei/... not present". JEI is still
    // a soft dependency of the shipped mod - this line only affects dev.
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc<=1.21.1
    // No JEI build exists for 1.21.2/1.21.3: only the 1.21.1 API jar at dev runtime.
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge-api:${rootProject.jei_version}") // mc>=1.21.2 mc<=1.21.3
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc>=1.21.4 mc<=1.21.5
    //modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge-api:${rootProject.jei_version}") // mc>=1.21.6 mc<=1.21.6 (no JEI build for 1.21.6; API jar only at dev runtime)
    modRuntimeOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-neoforge:${rootProject.jei_version}") // mc>=1.21.7



    compileOnly('org.xerial:sqlite-jdbc:3.46.0.0'){
        exclude group: "org.slf4j"
    }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    mergeServiceFiles()
    exclude 'META-INF/jars/**'
    exclude 'META-INF/maven/org.xerial/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}
