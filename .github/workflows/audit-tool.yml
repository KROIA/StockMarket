# Builds the offline audit tool (audit-tool/) into audit.exe + audit-gui.exe.
# - Tag push `audit-tool-v*`: build, then attach both exes to the GitHub release of that tag (created if missing).
#   The tool has its own tag prefix so it does not touch the mod's `v<version>` release assets.
# - workflow_dispatch: build and upload a workflow artifact only; never publishes.
name: audit-tool

on:
  push:
    tags: ['audit-tool-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: audit-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Self-check (source)
        run: python -I selftest.py
      - name: Build exes (PyInstaller in audit-tool/.venv, then exe selftest)
        run: python -I build.py
      - uses: actions/upload-artifact@v4
        with:
          name: audit-tool-windows
          path: |
            audit-tool/dist/audit.exe
            audit-tool/dist/audit-gui.exe

  release:
    if: startsWith(github.ref, 'refs/tags/audit-tool-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audit-tool-windows
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Audit tool $TAG" --notes "Offline StockMarket/BankSystem audit tool (Windows)."
          gh release upload "$TAG" audit.exe audit-gui.exe -R "$GITHUB_REPOSITORY" --clobber
