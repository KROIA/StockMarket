architectury {
    common rootProject.enabled_platforms.split(',')
}
repositories {
    maven { url 'https://maven.quiltmc.org/repository/release/' }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    flatDir {
        dir "../../../BankSystem/mc_${minecraft_version}_BankSystem/common/build/libs"
        dir "../../../MC_ModUtilities/mc_${minecraft_version}_MC_ModUtilities/common/build/libs"
    }
    maven { url 'https://jitpack.io' }

}


dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc<=1.21.11
    //implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version" // mc>=26.1

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc<=1.21.11
    //implementation "dev.architectury:architectury:$rootProject.architectury_api_version" // mc>=26.1

    modCompileOnly("com.github.KROIA.BankSystem:banksystem-common:$rootProject.banksystem_version") // mc<=1.21.11
    //compileOnly("com.github.KROIA.BankSystem:banksystem-common:$rootProject.banksystem_version:dev") // mc>=26.1 (common jars carry the dev classifier on 26.1)
    modCompileOnly("com.github.KROIA.MC_ModUtilities:modutilities-common:$rootProject.modutilities_version") // mc<=1.21.11
    //compileOnly("com.github.KROIA.MC_ModUtilities:modutilities-common:$rootProject.modutilities_version:dev") // mc>=26.1 (common jars carry the dev classifier on 26.1)

    compileOnly("mezz.jei:jei-${rootProject.jei_minecraft_version}-common-api:${jei_version}")
    compileOnly('org.xerial:sqlite-jdbc:3.46.0.0'){
        exclude group: "org.slf4j"
    }

    // LuckPerms API: compileOnly, never bundled. Only the dev-build LuckPerms tests (testing/) reference it,
    // in nested classes loaded only when LuckPerms is present.
    compileOnly "net.luckperms:api:${rootProject.luckperms_api_version}"

    // Offline unit tests (T-223): ModUtilities' testing.OfflineTests runs the TestSuites as JUnit DynamicTests.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

// `gradlew :common:test` runs the test suites that need no game (TestSuite.needsGame() == false), see
// src/test/java/.../StockMarketOfflineTests. Release mode (enable_dev_features=false) keeps testing/** out of main, so
// the test source set compiles it itself; the include pattern also covers src/test/java, whose classes therefore live
// in the testing package.
if (!(rootProject.findProperty('enable_dev_features') ?: 'false').toBoolean()) {
    sourceSets.test.java {
        srcDir 'src/main/java'
        include 'net/kroia/stockmarket/testing/**'
    }
}
configurations.testCompileOnly.extendsFrom configurations.compileOnly // ModUtilities/BankSystem/LuckPerms/JEI APIs
// ModUtilities and BankSystem are modCompileOnly (the game provides them); offline the tests need them at runtime.
// Loom creates the remapped configuration only after evaluation.
afterEvaluate { configurations.testRuntimeClasspath.extendsFrom configurations.modCompileClasspathMainMapped }

test {
    useJUnitPlatform()
    // The only JUnit class. In release mode all of testing/** is in the test classes; scanning it would load classes
    // of optional APIs that are not on the runtime classpath (LuckPerms).
    include 'net/kroia/stockmarket/testing/StockMarketOfflineTests*'
    workingDir = temporaryDir // Minecraft's log4j config writes logs/latest.log into the working directory
    // test-topic selection (ModUtilities tools/autotest/README.md), only the properties that are set:
    // gradlew :common:test -Dmodutilities.tests.include=stockmarket/sm_news
    ['modutilities.tests.exclude','modutilities.tests.include','modutilities.tests.offline'].each { p -> if (System.getProperty(p) != null) systemProperty p, System.getProperty(p) }
    // StockMarket dev switches of the market simulation harness (PluginTestSuite), the same way
    ['stockmarket.t207','stockmarket.t208','stockmarket.t208.filter','stockmarket.t208.out','stockmarket.t213','stockmarket.t213.filter','stockmarket.t197sweep'].each { p -> if (System.getProperty(p) != null) systemProperty p, System.getProperty(p) }
}
