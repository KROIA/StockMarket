<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockMarket</title>
<style>
  :root {
    --bg: #070b14; --panel: #0d1424; --panel2: #111a2e; --line: #1c2840;
    --text: #d6deeb; --muted: #7d8aa3; --accent: #2ec4b6;
    --buy: #26a69a; --sell: #ef5350; --amber: #f4b942; --grey: #5c6880;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header h1 span { color: var(--accent); }
  .live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
  .live.on i { background: var(--buy); box-shadow: 0 0 6px var(--buy); }
  .live.off i { background: var(--sell); }
  header .spacer { flex: 1; }
  header .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; grid-template-areas: "list chart side"; gap: 1px; background: var(--line); height: calc(100% - 45px); }
  section, aside { background: var(--panel); min-height: 0; }
  #list { grid-area: list; display: flex; flex-direction: column; }
  #center { grid-area: chart; display: flex; flex-direction: column; }
  #side { grid-area: side; overflow-y: auto; }
  #search { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  #search:focus { outline: none; border-color: var(--accent); }
  #markets { overflow-y: auto; flex: 1; }
  #markets summary { padding: 6px 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; }
  #markets ul { list-style: none; margin: 0; padding: 0; }
  .icon { width: 20px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; font: 600 9px var(--mono); color: #fff; }
  /* first 16x16 frame of animated (stacked) textures, crisp pixels */
  .icon img { width: 100%; height: 100%; object-fit: cover; object-position: top; image-rendering: pixelated; }
  .head .icon { width: 28px; height: 28px; font-size: 11px; align-self: center; }
  #markets li { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; border-left: 2px solid transparent; }
  #markets li:hover { background: var(--panel2); }
  #markets li.sel { background: var(--panel2); border-left-color: var(--accent); }
  #markets .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #markets .price { font-family: var(--mono); color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--grey); }
  .dot.OPEN { background: var(--buy); } .dot.MAINTENANCE { background: var(--amber); }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; padding: 12px 16px 8px; }
  .head h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .head .p { font: 600 20px var(--mono); color: var(--accent); }
  .head .st { font-size: 12px; color: var(--muted); text-transform: lowercase; }
  .head .id { font: 12px var(--mono); color: var(--grey); }
  .tfs { display: flex; gap: 4px; padding: 0 16px 8px; flex-wrap: wrap; }
  .tfs button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 3px 10px; border-radius: 4px; font: 12px var(--mono); cursor: pointer; }
  .tfs button.sel, .tfs button:hover { color: var(--text); border-color: var(--accent); }
  #chart { flex: 1; min-height: 320px; }
  .modes { display: flex; gap: 4px; padding: 10px 16px 0; }
  .modes button, #pairSwap, #pairStyle button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 14px; border-radius: 4px; font: inherit; cursor: pointer; }
  .modes button.sel, .modes button:hover, #pairSwap:hover, #pairStyle button.sel, #pairStyle button:hover { color: var(--text); border-color: var(--accent); }
  #pairBar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px 0; }
  #pairBar[hidden] { display: none; }
  #pairBar label { color: var(--muted); font-size: 12px; }
  #pairBar select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; max-width: 200px; }
  #pairBar .icon { width: 22px; height: 22px; }
  #pairRates { flex-basis: 100%; font: 12px var(--mono); color: var(--muted); }
  #side.dim { opacity: .45; }
  .empty { color: var(--muted); padding: 24px 16px; }
  h3 { margin: 0; padding: 12px 14px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #book { padding: 0 8px 8px; font: 12px var(--mono); }
  .lvl { position: relative; display: flex; justify-content: space-between; padding: 1px 6px; }
  .lvl .bar { position: absolute; right: 0; top: 0; bottom: 0; opacity: .18; }
  .lvl.ask { color: var(--sell); } .lvl.ask .bar { background: var(--sell); }
  .lvl.bid { color: var(--buy); } .lvl.bid .bar { background: var(--buy); }
  .lvl span { position: relative; }
  .mid { margin: 4px 0; padding: 4px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--accent); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  th { text-align: right; color: var(--muted); font-weight: 400; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  td { text-align: right; padding: 3px 8px; }
  th:first-child, td:first-child { text-align: left; }
  .buy { color: var(--buy); } .sell { color: var(--sell); }
  .tbl { padding: 0 6px 10px; }
  footer { color: var(--grey); font-size: 11px; padding: 10px 14px; }
  footer a { color: var(--muted); }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "chart" "list" "side"; height: auto; }
    #list { max-height: 260px; }
    #chart { min-height: 360px; }
    #side { overflow: visible; }
  }
  @media (max-width: 600px) { header .meta.cur { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Stock<span>Market</span></h1>
  <div id="live" class="live"><i></i><span id="liveText">connecting</span></div>
  <div class="spacer"></div>
  <div class="meta cur" id="currency"></div>
  <div class="meta" id="clock"></div>
</header>
<main>
  <aside id="list">
    <input id="search" type="search" placeholder="Search markets" aria-label="Search markets">
    <div id="markets"></div>
  </aside>
  <section id="center">
    <div class="modes"><button id="modeMarket" class="sel">Market</button><button id="modePair">Pair</button></div>
    <div id="pairBar" hidden>
      <label for="pairHave">I have</label><span id="pairHaveIcon"></span><select id="pairHave"></select>
      <button id="pairSwap" title="Swap" aria-label="Swap">&#8646;</button>
      <label for="pairWant">I want</label><span id="pairWantIcon"></span><select id="pairWant"></select>
      <span id="pairStyle"><button id="styleCandles" class="sel">Candles</button> <button id="styleLine">Line</button></span>
      <div id="pairRates"></div>
    </div>
    <div class="head">
      <span id="mIcon"></span>
      <h2 id="mName">No market selected</h2>
      <span class="p" id="mPrice"></span>
      <span class="st" id="mState"></span>
      <span class="id" id="mId"></span>
    </div>
    <div class="tfs" id="tfs"></div>
    <div id="chart"></div>
    <footer>Read-only view. Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> Lightweight Charts (<a href="vendor/LICENSE-lightweight-charts.txt">license</a>).</footer>
  </section>
  <aside id="side">
    <h3>Order book depth</h3>
    <div id="book"><div class="empty">-</div></div>
    <h3>Open player orders</h3>
    <div class="tbl"><table><thead><tr><th>Price</th><th>Buy</th><th>Sell</th><th>Orders</th></tr></thead><tbody id="orders"></tbody></table></div>
    <h3>Recent trades (24 h)</h3>
    <div class="tbl"><table><thead><tr><th>Time</th><th>Side</th><th>Amount</th><th>Avg price</th></tr></thead><tbody id="trades"></tbody></table></div>
  </aside>
</main>
<script src="vendor/lightweight-charts.js"></script>
<script src="app.js"></script>
</body>
</html>
