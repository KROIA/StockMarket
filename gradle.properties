# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Dev-only code (unit tests, test commands) is compiled only when true. Keep false in commits;
# set it to true locally for dev builds (those need ModUtilities and BankSystem jars built with -Penable_dev_features=true).
enable_dev_features=false

# Mod properties
mod_version = 1.21.6-2.2.2
maven_group = net.kroia
archives_name = stockmarket
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.6
yarn_mappings = 1.21.6+build.1
mapping_version=2024.06.16


# Dependencies
architectury_api_version = 17.0.6
fabric_loader_version = 0.16.14
fabric_api_version = 0.128.2+1.21.6
neoforge_version = 21.6.20-beta
yarn_mappings_patch_neoforge_version = 1.21+build.4
jei_version=21.4.0.27
jei_minecraft_version=1.21.5
banksystem_version = 1.21.6-2.2.2
modutilities_version=1.21.6-2.2.2
# TestKit (dev-only test framework mod), read from its build/libs: compile-only in dev builds, dev runtime with -Pwith_testkit=true
testkit_version = 1.21.6-0.1.0
# LuckPerms API (Maven Central): compileOnly, only the dev-build LuckPerms tests use it
luckperms_api_version = 5.4
# LuckPerms mod for dev runs only (opt-in: -Pwith_luckperms=true), Modrinth Maven version numbers.
luckperms_fabric_version = v5.5.10-fabric
luckperms_neoforge_version = v5.5.10-neoforge
# fabric-permissions-api for the LuckPerms dev run (same version ModUtilities bundles)
fabric_permissions_api_version = 0.4.1
